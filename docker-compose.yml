name: simple-file-store
services:
  simple-file-store:
    image: pxlvted/simplefilestore:latest
    container_name: simple-file-store
    deploy:
      resources:
        reservations:
          memory: "128M"
    network_mode: bridge
    ports:
      - target: 3000
        published: "3012"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SESSION_SECRET=${SESSION_SECRET}
      - WHITELIST=${WHITELIST}
      - WHITELISTFEATURE=${WHITELISTFEATURE:-TRUE}
      - SESSION_MAX_AGE_HOURS=24
      - COOKIE_SECURE=true
      - TRUST_PROXY=false
      - DATA_DIRECTORY=/app/data
      - MAX_FILE_SIZE_MB=2048
      - MAX_STORAGE_MB=25000
      - MAX_CONCURRENT_UPLOADS=3
      - MAX_GLOBAL_STAGING_MB=25000
      - MAX_GLOBAL_QUARANTINE_MB=25000
      - SCAN_CONCURRENCY=1
      - SCAN_TIMEOUT_SECONDS=120
      - MAX_SCAN_FILE_SIZE_MB=2048
      - QUARANTINE_RETENTION_DAYS=7
      - MAX_ARCHIVE_ENTRIES=10000
      - MAX_ARCHIVE_UNCOMPRESSED_MB=2048
      - MAX_ARCHIVE_ENTRY_MB=2048
      - MAX_ARCHIVE_COMPRESSION_RATIO=100